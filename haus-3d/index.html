    else if (k === "arrowup") { ensurePivot(); orbitBy(0, -s); }
    else if (k === "arrowdown") { ensurePivot(); orbitBy(0, s); }
    else if (k === "+" || k === "=") { const r = canvas.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 0.85); }
    else if (k === "-") { const r = canvas.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.18); }
    else return;
    e.preventDefault();
    redraw();
  });
  addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));
  addEventListener("blur", () => keys.clear());
  addEventListener("resize", redraw);
  for (const id of ["reset", "walk", "startsBtn", "cutBtn"]) $(id).disabled = false;
  updateUi();
  setCut(null);
  wake();
  say("");
  console.info("EasyDay3D: " + Math.round(triangles).toLocaleString("de-DE") + " Dreiecke, " + items.length
    + " Zeichenaufrufe, geladen in " + (performance.now() / 1000).toFixed(1) + " s");
  redraw();
  // Kleine Schnittstelle zum Einbetten und für automatische Prüfungen
  window.easyday3d = Object.freeze({
    state: () => ({ eye: cam.eye.slice(), yaw: cam.yaw, pitch: cam.pitch, pivot: pivot.slice(), walking: walk.on,
      feet: walk.feet, cut: cut < CUT_OFF ? cut : null, starts: starts.map(s => s.name), levels: levels.map(l => l.name) }),
    walk: on => setWalk(!!on),
    jump: i => { if (starts[i]) jumpTo(starts[i]); },
    level: i => { if (levels[i]) setCut(levels[i].y + CUT_ABOVE); else setCut(null); },
  });
  // Strahltests vorbereiten, sobald das erste Bild steht (Begehen startet dann sofort)
  setTimeout(() => { try { buildCollision(); } catch (e) { console.warn("Begehen nicht verfügbar", e); } }, 300);
}
// Erst hier starten: die Hilfsfunktionen oben sind jetzt alle definiert
try {
  await run();
} catch (e) {
  console.error(e);
  say("Das 3D-Modell lässt sich nicht anzeigen: " + (e && e.message ? e.message : e));
}
})();
</script>
