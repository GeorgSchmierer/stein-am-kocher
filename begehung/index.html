        for (let k = 0; k < n; k++) {
          stepDist += walkMove(scale(m, 1 / n));
          walkGround(dt / n);
        }
        moving = true;
      } else if (walkGround(dt)) moving = true;
      // Kopfwippen und Schritte (je Schritt ein Geräusch)
      const go = stepDist > 1e-4 && !walk.air;
      bob.amp += ((go ? 1 : 0) - bob.amp) * Math.min(1, dt * 8);
      if (go) {
        const before = Math.floor(bob.phase / Math.PI);
        bob.phase += stepDist / (run ? 0.9 : 0.7) * Math.PI;
        if (Math.floor(bob.phase / Math.PI) !== before) sound.step(run ? 1.3 : 1);
      }
      bob.y = bob.amp * 0.034 * (Math.abs(Math.sin(bob.phase)) - 0.5);
      bob.x = bob.amp * 0.014 * Math.sin(bob.phase);
      if (bob.amp > 0.01) moving = true;
    }
    const r0 = performance.now();
    render();
    frameMs = performance.now() - r0;
    drawMap();
    updateAim();
    updateArea(now);
    if (updateExposure(dt)) moving = true;
    pickLights(now);
    drawSigns();
    if (moving || keys.size || joy.id !== null) redraw();
  }

  // ---------- Menü ----------
  const menu = $("menu");
  function setPlaying(on) {
    if (playing && !on) pausedAt = performance.now();
    playing = on;
    menu.classList.toggle("hidden", on);
    if (!on) { keys.clear(); joy.x = joy.y = 0; }
    $("joy").style.display = on && touchSeen ? "block" : "none";
    $("jumpBtn").style.display = on && touchSeen ? "block" : "none";
    $("menuBtn").style.display = on && touchSeen ? "block" : "none";
    updateAim();
    redraw();
  }
  function start() {
    sound.resume();
    setPlaying(true);
    if (!touchSeen && canvas.requestPointerLock) {
      try {
        const p = canvas.requestPointerLock();
        if (p && p.catch) p.catch(() => {});
      } catch (e) { /* ohne Zeigerfang: Ziehen zum Umsehen */ }
    }
    canvas.focus();
  }
  function pause() {
    if (document.pointerLockElement === canvas && document.exitPointerLock) document.exitPointerLock();
    setPlaying(false);
  }
  $("go").onclick = start;
  $("menuBtn").onclick = pause;
  document.addEventListener("pointerlockchange", () => {
    locked = document.pointerLockElement === canvas;
    if (!locked && playing && !touchSeen) setPlaying(false);
  });
  const mkBtn = (text, cls, fn) => { const b = document.createElement("button"); b.className = cls || ""; b.textContent = text; b.onclick = fn; return b; };
  // Springen zu: Haupteingang und Fotostandpunkte nach Bereich
  // Springen: kurz abblenden, versetzen, aufblenden (kein Flug durch Wände; der Raumname kommt nach der Ankunft)
  let fading = false;
  function placeTo(eye, dir) {
    buildCollision();
    const d = Array.isArray(dir) && dir.every(isFinite) ? dir : forwardOf();
    const [y] = anglesOf([d[0], 0, d[2]]);
    const fade = $("fade");
    fading = true;
    anim = null;
    fade.classList.add("on");
    setTimeout(() => {
      const [x, feet, z] = startSpot(eye);
      walk.vy = 0; walk.air = false;
      walk.feet = feet;
      cam.eye = [x, feet + EYE, z];
      cam.yaw = y; cam.pitch = 0;
      shadowKey = "";
      areaAt = 0; lightsAt = 0;
      redraw();
      setTimeout(() => { fading = false; areaAt = 0; fade.classList.remove("on"); redraw(); }, 120);
    }, 260);
  }
  const entrance = W.entrance && Array.isArray(W.entrance.eye) && W.entrance.eye.every(isFinite) ? W.entrance : null;
  const places = $("places");
  {
    const h = document.createElement("div");
    h.className = "row";
    if (entrance) h.appendChild(mkBtn("Haupteingang", "chip", () => { placeTo(entrance.eye, entrance.dir); start(); }));
    places.appendChild(h);
    const groups = [];
    starts.forEach(s => { let g = groups.find(g => g.name === s.group); if (!g) groups.push(g = { name: s.group || "", items: [] }); g.items.push(s); });
    groups.forEach(g => {
      if (g.name) { const t = document.createElement("h3"); t.textContent = g.name; places.appendChild(t); }
      const row = document.createElement("div");
      row.className = "row";
      g.items.forEach(s => {
        const i = s.name.indexOf(" – ");
        const label = i > 0 && s.name.slice(0, i).trim() === g.name ? s.name.slice(i + 3) : s.name;
        row.appendChild(mkBtn(label, "chip", () => { placeTo(s.eye, s.dir); start(); }));
      });
      places.appendChild(row);
    });
    if (!entrance && !starts.length) places.previousElementSibling.style.display = "none";
  }
  // Steuerung
  {
    const fine = !touchSeen || matchMedia("(pointer: fine)").matches;
    const rows = fine
      ? [["Maus", "umsehen (Klick ins Bild fängt die Maus)"], ["W A S D / ↑ ↓", "gehen"], ["← →", "drehen"], ["Shift", "rennen"],
         ["Leertaste", "springen"], ["E / Klick", "Tür öffnen oder schließen"], ["L", "Licht im Raum an/aus"], ["M", "Minikarte ein/aus"], ["Esc", "Menü"]]
      : [["Joystick links", "gehen (ganz außen: rennen)"], ["Wischen", "umsehen"], ["Tippen auf eine Tür", "öffnen oder schließen"],
         ["⤒", "springen"], ["☰", "Menü"]];
    const box = $("keys");
    for (const [k, v] of rows) {
      const a = document.createElement("kbd"); a.textContent = k;
      const b = document.createElement("span"); b.textContent = v;
      box.append(a, b);
    }
  }
  // Qualität: Auflösung, Schattenkarte, Detailgrenze, Kantenglättung
  const QUALITY = {
    niedrig: { scale: 0.6, shadow: 1024, detail: 0.012, samples: 0 },
    mittel: { scale: 1, shadow: 2048, detail: 0.005, samples: 4 },
    hoch: { scale: 2, shadow: 4096, detail: 0.0018, samples: 4 },
  };
  let quality = touchSeen ? "niedrig" : "mittel";
  const settings = { sens: 1, speed: 1, fov: 75 };
  try {
    const v = JSON.parse(localStorage.getItem("easyday3d.walk.settings") || "{}");
    if (isFinite(v.sens)) settings.sens = Math.max(0.3, Math.min(3, v.sens));
    if (isFinite(v.speed)) settings.speed = Math.max(0.5, Math.min(2, v.speed));
    if (isFinite(v.fov)) settings.fov = Math.max(60, Math.min(90, v.fov));
  } catch (e) { /* ohne Speicher */ }
  function applySettings() {
    fovH = settings.fov;
    try { localStorage.setItem("easyday3d.walk.settings", JSON.stringify(settings)); } catch (e) { /* ohne Speicher */ }
    redraw();
  }
  fovH = settings.fov;
  try { const q = localStorage.getItem("easyday3d.walk.quality"); if (QUALITY[q]) quality = q; } catch (e) { /* ohne Speicher */ }
  function setQuality(q) {
    if (!QUALITY[q]) return;
    quality = q;
    const Q = QUALITY[q];
    detailK = Q.detail;
    renderScaleMax = Q.scale;
    postSamples = Q.samples;
    setShadowSize(Math.min(Q.shadow, maxTex));
    document.querySelectorAll("#quality button").forEach(b => b.classList.toggle("on", b.dataset.q === q));
    try { localStorage.setItem("easyday3d.walk.quality", q); } catch (e) { /* ohne Speicher */ }
    redraw();
  }
  {
    const box = $("quality");
    const lbl = document.createElement("span"); lbl.textContent = "Qualität:"; lbl.style.alignSelf = "center";
    box.appendChild(lbl);
    for (const q of Object.keys(QUALITY)) {
      const b = mkBtn(q[0].toUpperCase() + q.slice(1), "chip", () => setQuality(q));
      b.dataset.q = q;
      box.appendChild(b);
    }
    const tg = $("toggles");
    const toggle = (label, get, set) => {
      const b = mkBtn(label, "chip", () => { set(!get()); b.classList.toggle("on", get()); redraw(); });
      b.classList.toggle("on", get());
      tg.appendChild(b);
      return b;
    };
    toggle("Kopfwippen", () => bob.on, v => { bob.on = v; });
    toggle("Schritte hörbar", () => sound.on, v => { sound.on = v; if (v) sound.resume(); });
    toggle("Minikarte", () => mapOn, v => { mapOn = v; $("mapBox").style.display = v ? "block" : "none"; });
    // Regler: Empfindlichkeit, Gehtempo, Sichtfeld (im Browser gemerkt)
    const box2 = $("sliders");
    const slider = (label, key, min, max, step, fmt) => {
      const l = document.createElement("label"); l.textContent = label;
      const i = document.createElement("input");
      Object.assign(i, { type: "range", min, max, step, value: settings[key] });
      const o = document.createElement("output"); o.textContent = fmt(settings[key]);
      i.addEventListener("input", () => { settings[key] = +i.value; o.textContent = fmt(settings[key]); applySettings(); });
      l.htmlFor = i.id = "set-" + key;
      box2.append(l, i, o);
    };
    slider("Empfindlichkeit", "sens", 0.3, 3, 0.05, v => v.toFixed(1).replace(".", ",") + "×");
    slider("Gehtempo", "speed", 0.5, 2, 0.05, v => v.toFixed(1).replace(".", ",") + "×");
    slider("Sichtfeld", "fov", 60, 90, 1, v => v + "°");
  }

  // Virtueller Joystick und Sprungknopf (Touch)
  const joyEl = $("joy"), knob = joyEl.firstElementChild;
  const joySet = e => {
    const r = joyEl.getBoundingClientRect(), rad = r.width / 2;
    let x = (e.clientX - r.left - rad) / rad, y = (e.clientY - r.top - rad) / rad;
    const l = Math.hypot(x, y);
    if (l > 1) { x /= l; y /= l; }
    joy.x = x; joy.y = y;
    knob.style.transform = `translate(${x * 50}%, ${y * 50}%)`;
    redraw();
  };
  joyEl.addEventListener("pointerdown", e => { e.preventDefault(); e.stopPropagation(); sound.resume(); joyEl.setPointerCapture(e.pointerId); joy.id = e.pointerId; joySet(e); });
  joyEl.addEventListener("pointermove", e => { if (e.pointerId === joy.id) joySet(e); });
  const joyEnd = e => { if (e.pointerId !== joy.id) return; joy.id = null; joy.x = joy.y = 0; knob.style.transform = ""; };
  joyEl.addEventListener("pointerup", joyEnd);
  joyEl.addEventListener("pointercancel", joyEnd);
  $("jumpBtn").addEventListener("pointerdown", e => { e.preventDefault(); jump(); });

  // Zeiger: mit gefangener Maus umsehen; sonst ziehen (Maus wie im Spiel, Finger greifen das Bild)
  const pts = new Map();
  canvas.addEventListener("contextmenu", e => e.preventDefault());
  canvas.addEventListener("pointerdown", e => {
    canvas.focus();
    if (e.pointerType === "touch" && !touchSeen) { touchSeen = true; setPlaying(playing); }
    sound.resume();
    if (!playing) return;
    if (locked) { if (e.button === 0) toggleDoor(aimDoor(cam.eye, forwardOf())); return; }
    canvas.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, t0: performance.now(), moved: false, type: e.pointerType });
  });
  canvas.addEventListener("pointermove", e => {
    if (locked && playing) {
      const k = 0.0032 * settings.sens;
      cam.yaw -= e.movementX * k;
      cam.pitch = Math.max(-1.45, Math.min(1.45, cam.pitch - e.movementY * k));
      redraw();
      return;
    }
    const p = pts.get(e.pointerId);
    if (!p || !playing) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (Math.hypot(p.x - p.x0, p.y - p.y0) > 6) p.moved = true;
    const s = (p.type === "mouse" ? 0.0032 : 1.6 * fovY / Math.max(canvas.clientHeight, 1)) * settings.sens;
    const sign = p.type === "mouse" ? -1 : 1;
    cam.yaw += sign * dx * s;
    cam.pitch = Math.max(-1.45, Math.min(1.45, cam.pitch + sign * dy * s));
    redraw();
  });
  const release = e => {
    const p = pts.get(e.pointerId);
    pts.delete(e.pointerId);
    if (!p || p.moved || performance.now() - p.t0 > 400 || !playing) return;
    // Tippen bzw. Klick ohne gefangene Maus: Tür unter dem Zeiger, sonst Maus fangen
    const g = aimDoor(cam.eye, rayAt(p.x, p.y));
    if (g) toggleDoor(g);
    else if (p.type === "mouse" && !touchSeen && canvas.requestPointerLock) {
      try { const r = canvas.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (err) { /* bleibt beim Ziehen */ }
    }
  };
  canvas.addEventListener("pointerup", release);
  canvas.addEventListener("pointercancel", e => pts.delete(e.pointerId));
  canvas.addEventListener("wheel", e => e.preventDefault(), { passive: false });
  addEventListener("keydown", e => {
    if (e.target && e.target.tagName === "BUTTON" && (e.key === " " || e.key === "Enter")) return;
    const k = e.key.toLowerCase();
    if (k === "escape") {
      // Ein Esc, das gerade den Mausfang beendet hat, startet nicht gleich wieder
      if (playing) pause(); else if (!$("go").disabled && performance.now() - pausedAt > 600) start();
      e.preventDefault();
      return;
    }
    if (!playing) { if (k === "enter" && !$("go").disabled) start(); return; }
    if (["w", "a", "s", "d", "shift", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) {
      keys.add(k);
      if (k !== "shift") e.preventDefault();
      redraw();
      return;
    }
    if (k === " ") { e.preventDefault(); jump(); return; }
    if (k === "e" || k === "f") { e.preventDefault(); toggleDoor(aimDoor(cam.eye, forwardOf())); return; }
    if (k === "l") { e.preventDefault(); toggleLights(); return; }
    if (k === "m") { mapOn = !mapOn; $("mapBox").style.display = mapOn ? "block" : "none"; document.querySelectorAll("#toggles button")[2].classList.toggle("on", mapOn); redraw(); }
  });
  addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));
  addEventListener("blur", () => keys.clear());
  addEventListener("resize", redraw);

  // ---------- Start ----------
  setQuality(quality);
  setPlaying(false);
  say("Bereitet das Gehen vor …", 0.9);
  await new Promise(r => setTimeout(r, 30));
  try { buildCollision(); } catch (e) { console.warn("Kollision nicht verfügbar", e); }
  if (entrance) {
    const feet = feetFor(entrance.eye);
    walk.feet = feet;
    cam.eye = [entrance.eye[0], feet + EYE, entrance.eye[2]];
    [cam.yaw] = anglesOf([entrance.dir[0], 0, entrance.dir[2]]);
  } else if (starts.length) {
    const s = starts.find(s => s.group === "Außen") || starts[0];
    walk.feet = feetFor(s.eye);
    cam.eye = [s.eye[0], walk.feet + EYE, s.eye[2]];
    [cam.yaw] = anglesOf([s.dir[0], 0, s.dir[2]]);
  } else {
    // Vor das Haus, Blick zur Mitte
    const x = focusCenter[0], z = focus.max[2] + 6;
    const g = floorBelow(x, groundY + 1.6, z, 0, 50);
    walk.feet = g !== null ? g : groundY;
    cam.eye = [x, walk.feet + EYE, z];
    [cam.yaw] = anglesOf([focusCenter[0] - x, 0, focusCenter[2] - z]);
  }
  cam.pitch = 0;
  walk.on = true;
  try { buildSigns(); } catch (e) { console.warn("Türschilder nicht verfügbar", e); }
  say("Fertig", 1);
  // Einflug: aus etwa 12 m Entfernung und 6 m Höhe sanft zum Startpunkt
  {
    const goal = cam.eye.slice(), yaw = cam.yaw;
    const back = [Math.sin(yaw), 0, Math.cos(yaw)];
    const from = add(goal, add(scale(back, 12), [0, 6, 0]));
    cam.eye = from;
    cam.pitch = -0.42;
    const feet = walk.feet;
    flyTo(goal, yaw, 0, 3600, () => { walk.feet = feet; redraw(); });
  }
  setTimeout(() => $("loader").classList.add("done"), 150);
  $("sub").textContent = doors.length
    ? "Begehung – " + doors.length + (doors.length === 1 ? " Tür" : " Türen") + " zum Öffnen. Klick ins Bild fängt die Maus, Esc öffnet dieses Menü."
    : "Begehung – Klick ins Bild fängt die Maus, Esc öffnet dieses Menü.";
  if (touchSeen && !matchMedia("(pointer: fine)").matches) $("sub").textContent = "Begehung – Joystick links zum Gehen, wischen zum Umsehen, auf Türen tippen.";
  $("go").disabled = false;
  console.info("EasyDay3D Begehung: " + Math.round(triangles).toLocaleString("de-DE") + " Dreiecke, " + items.length
    + " Zeichenaufrufe, " + doors.length + " Türen, geladen in " + (performance.now() / 1000).toFixed(1) + " s");
  redraw();
  // Kleine Schnittstelle für Einbettung und automatische Prüfungen
  window.easyday3d = Object.freeze({
    state: () => ({ eye: cam.eye.slice(), yaw: cam.yaw, pitch: cam.pitch, feet: walk.feet, air: !!walk.air, playing, locked,
      frames, frameMs, flying: !!anim || fading, outside, title: document.title,
      signInfo, hall: inHallway([cam.eye[0], walk.feet + 1.2, cam.eye[2]], walk.feet),
      signs: signs.map(x => ({ text: x.el.textContent, p: x.p.slice(), out: x.out.slice() })),
      level: levels[levelAt(walk.feet)] ? levels[levelAt(walk.feet)].name : null, area: areaText, quality,
      aim: aimed ? doors.indexOf(aimed) : -1, doors: doors.map(g => ({ name: g.name, open: g.target > 0.5, t: g.t,
        at: g.leaves[0].hinge.slice(), y: g.y })), starts: starts.map(s => s.name) }),
    play: () => setPlaying(true),
    pause: () => pause(),
    jump: i => { if (starts[i]) placeTo(starts[i].eye, starts[i].dir); },
    entrance: () => { if (entrance) placeTo(entrance.eye, entrance.dir); },
    face: (yaw, pitch) => { cam.yaw = +yaw || 0; cam.pitch = clampPitch(+pitch || 0); redraw(); },
    place: (x, y, z, yaw) => { placeTo([+x, +y, +z], [-Math.sin(+yaw || 0), 0, -Math.cos(+yaw || 0)]); },
    door: i => toggleDoor(doors[i]),
    // Erster Treffer eines Strahls (festes Modell und Türen) – für Prüfungen
    ray: (o, d, max) => { const r = castMove(o, norm(d), +max || 10); return r ? { t: r.t, n: r.n } : null; },
    quality: q => setQuality(q),
    // Nachbearbeitung für Prüfungen ein-/ausschalten (Verschattung in Ecken, Glühen)
    post: (ao, bloom) => { if (isFinite(ao)) postAo = +ao; if (isFinite(bloom)) postBloom = +bloom; redraw(); },
  });
}
// Erst hier starten: die Hilfsfunktionen oben sind jetzt alle definiert
try {
  await run();
} catch (e) {
  console.error(e);
  fail("Die Begehung lässt sich nicht anzeigen: " + (e && e.message ? e.message : e));
}
})();
</script>
</body>
</html>
